[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "examwatch"
version = "0.1.0"
description = "Local-first exam observation and evidence review"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "httpx==0.28.1", "pydantic-settings==2.9.1", "psycopg[binary]==3.2.9",
  "numpy==1.26.4", "scipy==1.15.2", "python-multipart==0.0.20",
]

[project.optional-dependencies]
local = [
  "opencv-contrib-python==4.11.0.86", "mediapipe==0.10.21", "onnxruntime==1.21.1",
  "sounddevice==0.5.1", "soundfile==0.13.1", "transformers==4.51.3",
  "torch==2.6.0", "torchaudio==2.6.0", "silero-vad==5.1.2", "keyring==25.6.0",
  "scikit-image==0.25.2",
  "imageio-ffmpeg==0.6.0", "huggingface-hub==0.30.2",
]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1"]

[project.scripts]
examwatch-api = "examwatch.api.main:run"
examwatch-local = "examwatch.local.app:run"
examwatch-cleanup = "examwatch.api.cleanup:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
"examwatch.local" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
